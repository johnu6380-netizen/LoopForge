[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loopforge"
version = "0.4.0"
description = "An evolutionary loop that uses an LLM to improve algorithms, scored by a strict evaluator."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
loopforge = "loopforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loopforge = ["seeds/tsp/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
